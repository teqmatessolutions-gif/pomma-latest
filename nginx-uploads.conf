# Nginx configuration for /uploads directory
# This block fixes the image loading issue by properly serving static files from uploads directory
# 
# To apply this configuration:
# 1. Copy this block into your main Nginx server configuration
# 2. Replace the existing "location /uploads/" block
# 3. Test: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx

location /uploads {
    alias /opt/pomma/ResortApp/uploads;
    autoindex off;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff";
    
    # Enable CORS for font files and other assets if needed
    add_header Access-Control-Allow-Origin "*";
    
    # Handle missing files gracefully
    try_files $uri =404;
}
